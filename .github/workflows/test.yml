name: Django and browser checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: resive_test
          POSTGRES_PASSWORD: local-ci-password
          POSTGRES_DB: resive_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      LOCAL_DEMO: "1"
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgresql://resive_test:local-ci-password@127.0.0.1:5432/resive_test
      DATABASE_SCHEMA: public
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: |
          browser_path=$(find ~/.cache/ms-playwright -path '*/chrome-linux64/chrome' | head -1)
          test -n "$browser_path"
          echo "CHROME_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
      - run: ruff check config apps tests
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - run: python manage.py collectstatic --noinput
