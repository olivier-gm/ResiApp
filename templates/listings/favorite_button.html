{% if request.user.is_authenticated %}<form id="favorite-{{ listing.pk }}" method="post" action="{% url 'listings:favorite' listing.pk %}" hx-post="{% url 'listings:favorite' listing.pk %}" hx-target="this" hx-select="unset" hx-swap="outerHTML" hx-push-url="false">
  {% csrf_token %}<input type="hidden" name="saved" value="{% if is_favorite %}no{% else %}yes{% endif %}">
  <button class="button button-secondary" type="submit" aria-pressed="{{ is_favorite|yesno:'true,false' }}">{% if is_favorite %}♥ Guardado · quitar{% else %}♡ Guardar inmueble{% endif %}</button>
  <span class="sr-only" aria-live="polite">{% if is_favorite %}Inmueble guardado en favoritos{% endif %}</span>
</form>
{% else %}<a class="button button-secondary" href="{% url 'accounts:login' %}?next={{ listing.get_absolute_url|urlencode }}">♡ Inicia sesión para guardar</a>{% endif %}
