services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: resive_dev
      POSTGRES_USER: resive_dev
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resive_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_dev:
